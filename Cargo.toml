[package]
name = "sz-rust-sdk"
version = "4.3.1"
edition = "2024"
rust-version = "1.88"
authors = ["Senzing Community"]
license = "Apache-2.0"
description = "Rust SDK for Senzing entity resolution engine"
keywords = ["senzing", "entity-resolution", "ffi"]
categories = ["api-bindings", "database"]
repository = "https://github.com/brianmacy/sz-rust-sdk"
homepage = "https://senzing.com"
documentation = "https://docs.rs/sz-rust-sdk"
readme = "README.md"

[lib]
name = "sz_rust_sdk"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitflags = "2.11"
thiserror = "2.0"
libc = "0.2"
hex = "0.4"
# Shared FFI/marshaling core (C-ABI bindings + str<->C helpers) + error-taxonomy codegen, also
# depended on by Senzing's in-tree Rust binding layer (senzing-sys in the G2 repo) -- replaces the
# previously independently-vendored/maintained copies. Pinned to a full commit SHA; tag is a
# human-readable marker only.
sz-rust-sdk-ffi = { git = "https://github.com/brianmacy/sz-rust-sdk-ffi", rev = "2ad405774e71be3256d25206c00f2ba94ccab2db" } # v0.1.1

[dev-dependencies]
tokio-test = "0.4"
serial_test = "3.4"
serde_json = "1.0"
# NOTE: do NOT add sz-rust-sdk-ffi here. Cargo unifies a dependency's features across a package's
# normal + dev dependency edges (unlike build-dependencies, which resolver v2 keeps separate), so
# a dev-dependency entry here would silently re-enable the `ffi` feature already pulled in by the
# [dependencies] entry above -- exactly the Windows link failure
# tools/generate-error-mappings/README.md documents. Anything needing ONLY `codegen` belongs in
# tools/generate-error-mappings (its own standalone Cargo project), not here.

# Examples configuration
[[example]]
name = "environment_and_hubs"
path = "examples/initialization/environment_and_hubs.rs"

[[example]]
name = "engine_priming"
path = "examples/initialization/engine_priming.rs"

[[example]]
name = "lifecycle_patterns"
path = "examples/initialization/lifecycle_patterns.rs"

[[example]]
name = "load_records"
path = "examples/loading/load_records.rs"

[[example]]
name = "load_with_info"
path = "examples/loading/load_with_info.rs"

[[example]]
name = "search_records"
path = "examples/searching/search_records.rs"

[[example]]
name = "why_search"
path = "examples/searching/why_search.rs"

[[example]]
name = "register_data_sources"
path = "examples/configuration/register_data_sources.rs"

[[example]]
name = "manage_configuration"
path = "examples/configuration/manage_configuration.rs"

[[example]]
name = "get_version"
path = "examples/information/get_version.rs"

[[example]]
name = "check_datastore_performance"
path = "examples/information/check_datastore_performance.rs"

[[example]]
name = "delete_records"
path = "examples/deleting/delete_records.rs"

[[example]]
name = "complete_workflow"
path = "examples/complete_workflow.rs"

[[example]]
name = "snapshot_restore"
path = "examples/snapshot/snapshot_restore.rs"

# generate_error_mappings moved to tools/generate-error-mappings/ (its own standalone Cargo
# project) -- see that directory's README.md for why it can no longer be an [[example]] here.
