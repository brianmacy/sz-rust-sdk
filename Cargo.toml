[package]
name = "sz-rust-sdk"
version = "4.3.1"
edition = "2024"
rust-version = "1.88"
authors = ["Senzing Community"]
license = "Apache-2.0"
description = "Rust SDK for Senzing entity resolution engine"
keywords = ["senzing", "entity-resolution", "ffi"]
categories = ["api-bindings", "database"]
repository = "https://github.com/brianmacy/sz-rust-sdk"
homepage = "https://senzing.com"
documentation = "https://docs.rs/sz-rust-sdk"
readme = "README.md"

[lib]
name = "sz_rust_sdk"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitflags = "2.11"
thiserror = "2.0"
libc = "0.2"
hex = "0.4"
# Shared FFI/marshaling core (C-ABI bindings + str<->C helpers) + error-taxonomy codegen, also
# depended on by Senzing's in-tree Rust binding layer (senzing-sys in the G2 repo) -- replaces the
# previously independently-vendored/maintained copies. Pinned to a full commit SHA; tag is a
# human-readable marker only.
sz-rust-sdk-ffi = { git = "https://github.com/brianmacy/sz-rust-sdk-ffi", rev = "2ad405774e71be3256d25206c00f2ba94ccab2db" } # v0.1.1

[dev-dependencies]
tokio-test = "0.4"
serial_test = "3.4"
serde_json = "1.0"
# default-features = false: this example is codegen-only (a build-script-style generator), and on
# Windows an unused default `ffi` feature's SzHelper_free reference isn't reliably dead-stripped,
# causing an unresolved-external link failure -- see sz-rust-sdk-ffi's CHANGELOG (0.1.1).
sz-rust-sdk-ffi = { git = "https://github.com/brianmacy/sz-rust-sdk-ffi", rev = "2ad405774e71be3256d25206c00f2ba94ccab2db", default-features = false, features = ["codegen"] } # v0.1.1

